dataset_id: greenhouse_20261029_aisle01
bag_path: data/bags/nvidia_data_20261029_144639_humble
output_dir: data/datasets/greenhouse_20261029_aisle01
layout_path: layouts/greenhouse_20261029_single_aisle.yaml

topics:
  rgb: /camera/camera/color/image_raw
  depth: /camera/camera/aligned_depth_to_color/image_raw
  camera_info: /camera/camera/color/camera_info
  odometry: /Odometry
  tf_static: /tf_static

selection:
  distance_threshold_m: 0.5
  yaw_threshold_deg: 15.0
  minimum_time_interval_sec: 0.3
  maximum_sync_delta_ms: 100.0

frames:
  map: camera_init
  odometry_child: body
  camera: camera_color_optical_frame
  # FAST-LIO's body frame is treated as base_link, matching the baseline mapper.
  body_static_alias: base_link

image_output:
  jpeg_quality: 95

sam3:
  model_path: models/sam3.pt
  model_name: sam3.pt
  model_version: sam3.pt-sha256-9999e2341cee
  model_sha256: 9999e2341ceef5e136daa386eecb55cb414446a00ac2b55eb2dfd2f7c3cf8c9e
  worker_python: python3
  device: "0"
  image_size: 640
  confidence_threshold: 0.7
  prompt_config: sam3_prompts.yaml
  context_padding_ratio: 0.2

projection:
  version: greenhouse_projection_v1
  depth_scale_m: 0.001
  minimum_depth_m: 0.15
  maximum_depth_m: 15.0
  maximum_object_distance_m: 3.0
  minimum_depth_samples: 10
  mask_erosion_kernel_px: 5
  outlier_absolute_m: 0.2
  outlier_relative: 0.1

association:
  version: greenhouse_association_v1
  tracklet_max_distance_m: 0.5
  tracklet_max_diameter_m: 0.75
  cross_pass_candidate_radius_m: 1.0
  maximum_size_difference: 0.6
  size_cost_weight: 0.25
  cross_pass_maximum_cost: 1.1
  representative_weights:
    confidence: 0.35
    near_depth: 0.20
    valid_depth_ratio: 0.30
    mask_quality: 0.15

semantic_enrichment:
  python: python3
  prompt_version: greenhouse_semantics_v2
  prompt_config: semantic_prompts_v2.yaml
  temperature: 0
  maximum_retries: 2
  maximum_object_views: 3
  clip:
    model_name: ViT-B-16
    device: cuda
  ollama:
    base_url: http://127.0.0.1:11435
    model: gemma4:12b-it-q4_K_M
    allow_local_fallback: true
    local_fallback_model: gemma4:e4b

retrieval:
  version: greenhouse_retrieval_v1
  prompt_config: retrieval_prompts_v1.yaml
  clip:
    python: python3
    model_name: ViT-B-16
    # Text-only encoding is lightweight and remains available without GPU access.
    device: cpu
  ambiguity:
    minimum_similarity: 0.20
    minimum_top1_margin: 0.08
    minimum_parser_confidence: 0.75
    verification_top_k: 3
  ollama:
    base_url: http://127.0.0.1:11435
    model: gemma4:12b-it-q4_K_M
    allow_local_fallback: true
    local_fallback_model: gemma4:e4b
    temperature: 0
    auto_start: true
    models_path: /usr/share/ollama/.ollama/models
    llm_library: cuda_v13
    context_length: 8192
    startup_timeout_sec: 30
