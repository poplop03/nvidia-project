<text x="32" y="38" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="21" font-weight="700" fill="#0F172A">4. 3D Coordinate &amp; Frame Transform Chain (2D Pixel Mask → Metric Aisle Object)</text>
